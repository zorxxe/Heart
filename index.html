<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сердечко для Вари</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');

        body {
            background: url('secret.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #fff5f8; /* Запасной цвет, если картинка не загрузится */
            color: #ff6b88;
            margin: 0;
            padding: 0;
            font-family: 'Comic Neue', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Добавляем полупрозрачный слой поверх фона для лучшей читаемости */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 245, 248, 0.15); /* Более прозрачный фон */
            z-index: -1;
        }
        
        .falling-hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-image: url('heart.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            opacity: 0.7;
            z-index: -1;
        }
        
        @keyframes fall {
            from {
                transform: translate(0, -10vh) rotate(0deg);
            }
            to {
                transform: translate(10px, 110vh) rotate(20deg);
            }
        }
        
        @keyframes sway {
            0% {
                margin-left: 0px;
            }
            25% {
                margin-left: 25px;
            }
            50% {
                margin-left: -25px;
            }
            75% {
                margin-left: 25px;
            }
            100% {
                margin-left: 0px;
            }
        }
        
        h1 {
            color: #ff3333;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        
        .heartbeat-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.2);
            border: 2px solid #ffdddd;
            width: 80%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }
        
        .heart-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .heart-image {
            transition: transform var(--animation-speed, 1s) ease-in-out;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        /* Улучшаем внешний вид контейнеров на фоне фото */
        .heartbeat-container, .pulse-container, .controls, .slider-container {
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.3);
            margin: 10px 0;
        }
        
        h1 {
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.25);
        }
        
        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        .cute-message {
            font-size: 1.2em;
            color: #ff3333;
            text-align: center;
            margin: 20px 0;
        }
        
        .footer {
            text-align: center;
            color: #ff3333;
            margin-top: 30px;
            font-size: 0.9em;
            position: relative;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 8px 15px;
            border-radius: 15px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }
        
        button {
            background-color: #ff3333;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 24px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 51, 51, 0.3);
            transition: all 0.3s ease;
        }
        
        button:hover {
            background-color: #e02b2b;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 51, 51, 0.4);
        }
        
        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 4px rgba(255, 51, 51, 0.2);
        }
        
        .slider-container {
            text-align: center;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }
        
        input[type="range"] {
            appearance: none;
            width: 200px;
            height: 8px;
            background: #ff6b88;
            border-radius: 5px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #ff3333;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .pulse-container {
            text-align: center;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }
        
        .pulse-label {
            font-family: 'Comic Neue', cursive;
            color: #ff3333;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="falling-hearts-container" id="falling-hearts"></div>
    
    <h1>❤️ Сердечко для Вари ❤️</h1>

    <div class="heartbeat-container">
        <div class="cute-message">
            Смотри как круто! ❤️
        </div>
        <div class="heart-container">
            <img src="heart.png" class="heart-image" alt="Heart">
        </div>
    </div>

    <div class="pulse-container">
        <div class="pulse-label">Контейнер с пульсом:</div>
        <div class="pulse-label" id="pulse-display">Пульс: 75 bpm</div>
    </div>

    <div class="controls">
        <button onclick="startEverything()">Запустить</button>
        <button onclick="stopEverything()">Остановить</button>
    </div>

    <!-- Аудио-элемент для воспроизведения музыки -->
    <audio id="backgroundMusic" loop>
        <source src="kaif.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио элемент.
    </audio>

    <div class="slider-container">
        <label for="speed-slider" class="cute-message">Скорость биения (ударов в минуту):</label>
        <input type="range" id="speed-slider" min="40" max="180" value="75" step="1" onchange="updateSpeed(this.value)">
    </div>

    <div class="footer">
        Сделано с теплотой для Вари ❤️
    </div>

    <script>
        // Настройки для падающих сердечек
        const fallingHeartsSettings = {
            minSize: 10,
            maxSize: 30,
            minDuration: 6,
            maxDuration: 12,
            minDelay: 0,
            maxDelay: 5,
            totalHearts: 30
        };
        
        // Функция для пересоздания сердечек (на случай, если первая попытка не сработала)
        function refreshHearts() {
            const container = document.getElementById('falling-hearts');
            container.innerHTML = '';
            createFallingHearts();
        }
        
        // Создаем падающие сердечки
        function createFallingHearts() {
            const container = document.getElementById('falling-hearts');
            
            for (let i = 0; i < fallingHeartsSettings.totalHearts; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                // Случайные размеры
                const size = Math.random() * (fallingHeartsSettings.maxSize - fallingHeartsSettings.minSize) + fallingHeartsSettings.minSize;
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                
                // Случайное положение по горизонтали
                const xPos = Math.random() * 100;
                heart.style.left = `${xPos}%`;
                
                // Случайная скорость падения
                const fallDuration = Math.random() * (fallingHeartsSettings.maxDuration - fallingHeartsSettings.minDuration) + fallingHeartsSettings.minDuration;
                const swayDuration = fallDuration * 0.5;
                
                // Явно устанавливаем анимации
                heart.style.animation = `fall ${fallDuration}s linear infinite, sway ${swayDuration}s ease-in-out infinite`;
                
                // Случайная задержка
                const delay = Math.random() * (fallingHeartsSettings.maxDelay - fallingHeartsSettings.minDelay) + fallingHeartsSettings.minDelay;
                heart.style.animationDelay = `${delay}s, ${delay}s`;
                
                container.appendChild(heart);
            }
        }
        
        // Запускаем создание сердечек при загрузке страницы
        window.addEventListener('load', () => {
            createFallingHearts();
            // Дополнительная попытка через секунду, если что-то пошло не так
            setTimeout(refreshHearts, 1000);
        });
        
        // Код для биения сердца
        let animationSpeed = 60 / 75; // Начальная скорость: 75 bpm
        const backgroundMusic = document.getElementById('backgroundMusic');

        function startEverything() {
            // Запуск анимации сердца
            startAnimation();
            
            // Запуск музыки
            backgroundMusic.play().catch(e => {
                console.log("Ошибка воспроизведения аудио:", e);
                alert("Для воспроизведения музыки необходимо взаимодействие пользователя. Пожалуйста, нажмите на кнопку еще раз.");
            });
        }

        function stopEverything() {
            // Остановка анимации сердца
            stopAnimation();
            
            // Остановка музыки
            backgroundMusic.pause();
            backgroundMusic.currentTime = 0;
        }

        function startAnimation() {
            const heart = document.querySelector('.heart-image');
            heart.style.animation = `beat ${animationSpeed}s infinite`;
        }

        function stopAnimation() {
            const heart = document.querySelector('.heart-image');
            heart.style.animation = 'none';
        }

        function updateSpeed(bpm) {
            animationSpeed = 60 / bpm;
            document.documentElement.style.setProperty('--animation-speed', animationSpeed + 's');
            
            // Обновляем отображение пульса
            document.getElementById('pulse-display').textContent = `Пульс: ${bpm} bpm`;
            
            const heart = document.querySelector('.heart-image');
            if (heart.style.animation && heart.style.animation !== 'none') {
                heart.style.animation = `beat ${animationSpeed}s infinite`;
            }
        }
        
        // Автоматически запускаем анимацию сердца при загрузке
        window.addEventListener('load', () => {
            setTimeout(() => {
                startAnimation();
                // Музыку автоматически не запускаем, т.к. браузеры блокируют автозапуск
                // Пользователь должен сам нажать кнопку "Запустить"
            }, 500);
        });
    </script>
</body>
</html>
